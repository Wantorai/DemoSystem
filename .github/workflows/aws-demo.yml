name: Demo CI and AWS deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crm-backend
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crm-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crm-fronend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
      NEXT_PUBLIC_STATIC_BASE_URL: http://localhost:5000
      STATIC_BASE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crm-fronend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: aws-demo-deploy
      cancel-in-progress: false
    env:
      AWS_SECURITY_GROUP_ID: ${{ vars.AWS_SECURITY_GROUP_ID }}
      AWS_PAGER: ''
      AWS_HOST: ${{ secrets.AWS_HOST }}
      AWS_USER: ${{ secrets.AWS_USER }}
      AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
      AWS_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_HOST:?Set AWS_HOST}" "${AWS_USER:?Set AWS_USER}"
          : "${AWS_SSH_KEY:?Set AWS_SSH_KEY}" "${AWS_KNOWN_HOSTS:?Set AWS_KNOWN_HOSTS}"
          [[ "$AWS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$AWS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect OIDC identity
        shell: bash
        env:
          EXPECTED_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          node <<'NODE'
          async function main() {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'sts.amazonaws.com');
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error('OIDC request failed: HTTP ' + response.status);
            const { value } = await response.json();
            if (typeof value !== 'string' || value.split('.').length !== 3) {
              throw new Error('Unexpected OIDC response');
            }
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'));
            // Never print the JWT, request token, full response or full claim set.
            const identity = { role: process.env.EXPECTED_ROLE_ARN };
            for (const key of ['iss', 'aud', 'sub', 'ref', 'repository', 'environment', 'job_workflow_ref']) {
              identity[key] = claims[key] ?? null;
            }
            console.log(JSON.stringify(identity, null, 2));
          }
          main().catch(() => {
            console.error('Unable to inspect OIDC identity; token and response omitted.');
            process.exitCode = 1;
          });
          NODE
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: demo-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          allowed-account-ids: '734828257743'
          retry-max-attempts: 2
      - name: Open temporary SSH access
        id: ingress
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_SECURITY_GROUP_ID:?Set AWS_SECURITY_GROUP_ID}"
          [[ "$AWS_SECURITY_GROUP_ID" =~ ^sg-[a-f0-9]+$ ]]
          runner_ip=$(curl -4 --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 20 https://checkip.amazonaws.com)
          node -e 'if (require("node:net").isIP(process.argv[1]) !== 4) process.exit(1)' "$runner_ip"
          permissions=$(jq -cn --arg cidr "$runner_ip/32" --arg description "GitHub Actions demo $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"             '[{IpProtocol:"tcp",FromPort:22,ToPort:22,IpRanges:[{CidrIp:$cidr,Description:$description}]}]')
          aws ec2 authorize-security-group-ingress --group-id "$AWS_SECURITY_GROUP_ID"             --ip-permissions "$permissions" --output json > "$RUNNER_TEMP/demo-ingress.json"
          rule_id=$(jq -er '.SecurityGroupRules[0].SecurityGroupRuleId' "$RUNNER_TEMP/demo-ingress.json")
          [[ "$rule_id" =~ ^sgr-[a-f0-9]+$ ]]
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"
          echo "Temporary SSH rule: $rule_id ($runner_ip/32)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for SSH access
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$AWS_USER@$AWS_HOST" true; then
              exit 0
            fi
            sleep 5
          done
          echo "SSH is still unavailable after opening temporary access" >&2
          exit 1
      - name: Deploy checked commit
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then echo "A newer main commit exists; refusing stale deployment"; exit 1; fi
          node scripts/ci/sync-source.cjs --check .
          git archive --format=tar.gz -o "$RUNNER_TEMP/demo.tar.gz" HEAD crm-backend crm-fronend scripts/ci
          remote="/tmp/demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          scp "${opts[@]}" "$RUNNER_TEMP/demo.tar.gz" "$AWS_USER@$AWS_HOST:$remote"
          ssh "${opts[@]}" "$AWS_USER@$AWS_HOST" "bash -s -- '$remote' '$GITHUB_SHA'" < scripts/ci/deploy-aws.sh
      - name: Close temporary SSH access
        if: always()
        shell: bash
        env:
          RULE_ID: ${{ steps.ingress.outputs.rule_id }}
        run: |
          set -euo pipefail
          # Also recover the ID if opening the rule succeeded but publishing its output failed.
          if [[ -z "$RULE_ID" && -s "$RUNNER_TEMP/demo-ingress.json" ]]; then
            RULE_ID=$(jq -r '.SecurityGroupRules[0].SecurityGroupRuleId // empty' "$RUNNER_TEMP/demo-ingress.json")
          fi
          if [[ -z "$RULE_ID" ]]; then exit 0; fi
          [[ "$RULE_ID" =~ ^sgr-[a-f0-9]+$ ]]
          for attempt in {1..3}; do
            if aws ec2 revoke-security-group-ingress --group-id "$AWS_SECURITY_GROUP_ID"               --security-group-rule-ids "$RULE_ID" --output json > "$RUNNER_TEMP/demo-revoke.json"; then
              if jq -e --arg id "$RULE_ID" '.Return == true and any(.RevokedSecurityGroupRules[]?; .SecurityGroupRuleId == $id)' "$RUNNER_TEMP/demo-revoke.json" >/dev/null; then
                echo "Removed temporary SSH rule: $RULE_ID" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Could not confirm removal of $RULE_ID from $AWS_SECURITY_GROUP_ID. Check and remove this temporary rule in AWS."
          exit 1
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

